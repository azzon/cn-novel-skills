# workflows/periodic.yaml
# 周期性审计确定性工作流

workflow: periodic
version: "2.0"

# 多书隔离: 本工作流中一切 story/ text/ <书根>/ledgers/ 路径均指【书根内】相对路径(docs/多书隔离协议.md)。
# <书根>/ledgers/ 同样按书隔离: 主书=仓库根<书根>/ledgers/, 非主书=<书根>/<书根>/ledgers/。

phases:
  phase_every_10:
    name: "每10章审计"
    trigger: "章号 % 10 == 0"
    steps:
      - id: drift_audit
        name: "漂移审计"
        type: agent
        outputs: ["<书根>/story/audit/漂移审计-第N期.md"]
        gate: ["报告存在且包含数据表"]
      - id: style_recal
        name: "风格包范例段更新"
        type: agent
        inputs: ["近10章中评分最高的3段"]
        outputs: ["<书根>/story/50-风格包.md(范例段替换)"]
        gate: ["范例段≥3段且来自不同章"]
      - id: anchor_recal
        name: "冷读裁判再校准(商用: LLM裁判会漂——劣锚重打分,任一≥7=冷读体系失准)"
        type: agent
        skill: reader-proxy
        gate:
          - "劣锚三张重打分均<7(锚定有效)"
          - "失准→重读锚样本+复冷读最近2章,偏差入反馈"
      - id: feedback_loop
        name: "读者反馈回路(发布后;未发布则跳过)"
        type: agent
        skill: revise
        condition: "ledgers/读者反馈账.md 有新增条目"
        gate:
          - "每个弃书点有处置(修订排期或理由)"
          - "爽点管道按反馈校准"
      - id: ledger_compact
        name: "账本压缩(百万字韧性: 已收伏笔归档/时间线钩分布保尾60/生成记录保尾120)"
        type: script
        script: "python3 tools/ledger_compact.py <书根>"
        gate:
          - "压缩幂等(归档区存在则跳过)"
          - "recompute/gate 时序取末条不受影响"
      - id: material_refill
        name: "素材库扩容(阈值<40条≈13章时强制)"
        type: agent
        skill: world-economy
        condition: "素材库余量<40条"
        gate:
          - "扩容≥60条且过年代锚核查(2005不存在的事物禁入)"
      - id: ledger_audits
        name: "四账审计(磨刀第六批:伏笔逾期/数字恒等式/期待链/就绪度)"
        type: script
        script: |
          python3 tools/foreshadow_audit.py <书根>
          python3 tools/number_audit.py <书根>
          python3 tools/anticipation_audit.py <书根>
          python3 tools/system_readiness.py <书根>
        gate:
          - "foreshadow/number 零FAIL(FAIL=账本崩,先修账)"
          - "就绪度判定非'先修再产'"
        on_fail: "账本崩→rebuild;提醒类→入修订期清单,不阻塞"

      - id: voice_check
        name: "角色声口复核"
        type: agent
        inputs: ["近10章对白+声口卡"]
        outputs: ["<书根>/story/audit/声口复核-第N期.md"]
        gate: ["无新增S级装对白"]
      - id: conflict_check
        name: "冲突升级检查"
        type: script
        # 红队20260915: 原为中文句子伪script步骤
        review: "检查冲突升级追踪表是否需要更新(人工审)"
        gate: ["冲突规模比上期大"]
      - id: evals_rebaseline
        name: "evals基线重录"
        type: script
        script: "python3 tools/evals.py record"

      - id: failure_analytics
        name: "失败模式分析(红队20260919: 从反复FAIL中学习→优化PREFIX/卡骨架)"
        type: script
        script: "python3 tools/failure_analytics.py <书根>"
        gate:
          - "高频FAIL(≥3次)有对应优化建议"
          - "建议落入audit/failure-analytics.md"

      - id: continuity_guard
        name: "内容连续性守卫(红队20260919: 生死账+伏笔完整性+情节跳变+情节重复)"
        type: script
        script: "python3 tools/continuity_guard.py <书根>"
        gate:
          - "零致命穿帮(死人复活/悬空伏笔>10)"
          - "情节重复连续≥5章=0"

      - id: multi_lens_check
        name: "多视角冷读抽检(红队20260919: 全过机器门≠高质量)"
        type: agent
        skill: multi_lens_coldread
        condition: "每20章或卷末"
        inputs: ["评分最高章+评分最低章各1"]
        gate:
          - "五视角均值≥7.0"
          - "弃书审判官'高风险'=打回"
          - "文笔鉴赏家'AI风险高'=去AI化修订"

  phase_volume_end:
    name: "卷末审计"
    trigger: "卷最后一章done通过"
    steps:
      - id: arc_review
        name: "连读审查"
        type: agent
        skill: arc-review
        inputs: ["本卷全部章节"]
        outputs: ["<书根>/story/audit/连读审查-卷N.md"]
      - id: consistency_audit
        name: "一致性审计"
        type: agent
        skill: consistency-audit
        inputs: ["本卷全部章节+全部台账"]
        outputs: ["<书根>/story/audit/一致性审计-卷N.md"]
        gate: ["矛盾清单中P0=0"]
      - id: character_audit
        name: "人设漂移审计"
        type: agent
        skill: character-audit
        inputs: ["本卷全部章节+人物圣经"]
        outputs: ["<书根>/story/audit/人设审计-卷N.md"]
      - id: volume_retro
        name: "卷末复盘"
        type: agent
        inputs: ["卷二纲+实际产出+全部审计报告"]
        outputs: ["<书根>/story/audit/卷N复盘.md"]
        gate:
          - "三峰位置回顾"
          - "下一卷冲突升了一级吗"
          - "伏笔对账(应收的收了吗/该养的在养吗)"
      - id: next_volume_plan
        name: "下一卷大纲"
        type: agent
        skill: volume-outline
        inputs: ["卷N复盘+当前时刻卡+下一卷冲突升级要求"]
        outputs: ["<书根>/story/30-情节/卷(N+1)纲.md"]
        gate: ["红队通过"]

  phase_3_redteam:
    name: "系统红队(每卷末或每30章,大审计-35制度化)"
    steps:
      - id: redteam_fanout
        name: "六路红队代理攻击"
        type: manual
        review: |
          并行派6个干净代理: 技能库/流水线工具/工作流执行性/读者位(追读连读)/长跑稳定性/预验尸。
          报告落story/audit/红队-<域>-<日期>.md;P0当批修复并加self_test金丝雀;结论入大审计-N。
          纪律: 攻击位≠建造位——读者位代理只读成品判追读,不读设计文档辩护。
          附加: 卷末跑 tools/anchor_canary.py <书根>(金丝雀哨兵)+market-scan白金锚滚动加料(锚漂移对策,大审计-36)。

