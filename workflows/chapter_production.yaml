# workflows/chapter_production.yaml
# 章节生产阶段确定性工作流
# 每章经过以下步骤，任何一步FAIL不继续

workflow: chapter_production
# ═══════════════════════════════════════════════════════════════
# SKILL_PROTOCOL(铁律一落地: 没有被执行的技能等于不存在):
#   type=agent 步骤执行前必须先读 skill 字段指向的 SKILL.md 全文,按其产出物规范执行;
#   每步完成后在 ledgers/技能执行记录.md 打勾登记(跳过=该步产物无效,done验收时输出执行率)。
#   工具步骤(type=script)必须真实执行,禁止"等效手写"。
# ═══════════════════════════════════════════════════════════════
version: "2.0"
description: "单章从场景卡到入库的确定性流程"

# 多书隔离: 本工作流中一切 story/ text/ <书根>/ledgers/ 路径均指【书根内】相对路径(docs/多书隔离协议.md)。
# <书根>/ledgers/ 同样按书隔离: 主书=仓库根<书根>/ledgers/, 非主书=<书根>/<书根>/ledgers/。

phases:
  phase_1_prep:
    name: "章节准备"
    steps:
      - id: scene_card
        name: "场景卡"
        type: agent
        skill: scene-card
        inputs:
          - "<书根>/ledgers/当前时刻卡.md"
          - "<书根>/story/30-情节/卷X纲.md"
          - "上章末段原文(500字)"
          - "<书根>/story/60-圣经/声口卡.md"
        outputs:
          - "<书根>/text/卡/卷X-第NNN章-场1.md"
        gate:
          - "卡包含:情感目标/冲突源/代价/赢法类型/峰值场景/峰后动作/开场型"
          - "开场型与前两章错型"
          - "数字表完成(所有数字事实列出)"
          - "Forbid列表非空"
          - "continues_from填了(承接上章末)"
        gate_extra:   # 审计-32 S1: 排纲与正文生长状态对齐(实战教训: 纲ch002规划新案但ch001已生长三案挂起状态)
          - "卡剧情与 <书根>/ledgers/当前时刻卡.md 的最后事件/未决线连续(不许无视前章生长出的状态)"
          - "与卷纲该章规划对齐;偏航须在卡PRE-CHECK栏登记原因"

      - id: bundle_check
        name: "注入物检查"
        type: script
        script: "python3 tools/pipeline.py bundle {N}"
        gate:
          - "所有注入物无裁剪标记"
          - "总字数在上限内"

  phase_2_draft:
    name: "初稿生成"
    steps:
      - id: draft
        name: "生成初稿"
        type: agent
        skill: scene-draft
        inputs:
          - "pipeline bundle输出(含PREFIX/卡/声纹/风格卡/上一章末/时刻卡/圣经/伏笔/钩型/素材/爽点管道/口碑账)"
          - "<书根>/text/卡/卷X-第NNN章-场1.md"
        outputs:
          - "<书根>/text/卷X/第NNN章.md"
        gate:
          - "CJK字数≥2500(硬线)"
          - "直引号=0"
          - "破折号≤3"
          - "money_conflict=0"
          - "near_dup=0"

  phase_3_review:
    name: "审改"
    steps:
      - id: self_review
        name: "自审"
        type: agent
        skill: scene-audit
        inputs:
          - "<书根>/text/卷X/第NNN章.md"
          - "<书根>/text/卡/卷X-第NNN章-场1.md"
        outputs:
          - "<书根>/story/audit/自审-第NNN章.md"
        gate:
          - "场景卡的所有beats都有正文对应"
          - "价值换极发生了"
          - "Forbid没有违犯"
          - "峰后禁释令合规"
          - "对白声口合规"
      - id: cold_read
        retry_protocol: "失败/超时重试2次;非硬门章(非5倍数/非卷首)降级为'拉力判据+致命问题'二项快评;硬门章失败=保留HALT入人审队列"
        name: "冷读"
        type: agent
        skill: reader-proxy
        inputs:
          - "<书根>/text/卷X/第NNN章.md"
          - "上章末段原文(500字)"
        outputs:
          - "<书根>/story/audit/冷读-第NNN章.md"
        gate:
          - "判定不是REWRITE/HOOK_FAIL"
          - "跳读≤2处"
          - "追读欲不是无所谓"
      - id: agent_storm_chapter
        name: "五波agent风暴(红队20260919: 每章≥5波×10=50 subagent红蓝对抗)"
        type: script
        script: "python3 tools/agent_storm.py chapter <正文文件> --book <书根>"
        # 红队20260919用户令: 每章全5波,不设条件跳过
        gate:
          - "Wave1-5全派发(50 agent/章)"
          - "Wave3仲裁波终审法官判定'放行'"
          - "Wave5守卫波G10放行官签字"
          - "任一wave发现致命问题→revise_loop修复→重跑该wave"

      - id: elevation_loop
        name: "升格环(磨刀十八批提上限: 过门≠结束——冷读<9.0触发定向润色一轮再评,上限≤1轮)"
        type: agent
        skill: line-polish
        condition: "冷读总分<9.0且无致命问题(致命走revise)"
        prescription: "只攻冷读最弱两项量规(轴制: 声音/节奏/钩/陈词),禁无差别通改;润后复冷读,分不升即回滚"
      - id: heartbeat_takes
        name: "心跳拍多方案(关键beat两版盲选——焦点行含'心跳/峰值'或章级=峰章时必走)"
        type: agent
        skill: alt-takes
        condition: "场景卡焦点行含 心跳|峰值 或 章级:峰章"
      - id: machine_gates
        name: "机器门"
        type: script
        script: |
          bash tools/fix_quotes.py <书根>/text/卷X/第NNN章.md   # 引号三重修复先于门
          python3 tools/check.py --modern <书根>/text/卷X/第NNN章.md
          python3 tools/gate_chapter.py <书根>/text/卷X/第NNN章.md
          python3 tools/voice_check.py <书根>/text/卷X/第NNN章.md --card <书根>/story/20-人物/声纹表.md
          python3 tools/card_check.py NNN --volume X
        gate:
          - "check.py FAIL=0"
          - "gate PASS"
          - "声口门PASS(禁词零FAIL)"
          - "数字表对账零FAIL(WARN需人工核对或修卡)"
        on_fail: "按门类型路由: 文本伤→revise / 声口违例→dialogue-doctor+查声口卡 / 数字漂移→修正文或修卡(rebuild原则:手稿唯一权威)"

  phase_4_revise:
    name: "修订(条件执行)"
    condition: "phase_3任一步FAIL"
    steps:
      - id: revise
        name: "修订"
        type: agent
        skill: "根据FAIL类型选择: scene-rewrite/tighten/de-ai/dialogue-doctor/tone-shift"
        inputs:
          - "审改报告"
          - "当前稿件"
        outputs:
          - "修订后的稿件"
        loop: "回到phase_3重新审改,最多5次"
        escalation:   # 磨刀十四批: 5次上限后不许静默放行
          - "≤2次: 按处方修(line-polish/tighten/beat-expand/de-ai/dialogue-doctor/tone-shift)"
          - "3-5次: scene-rewrite 整场重写(禁字符串补丁)"
          - ">5次仍不过: 自动降级——alt-takes盲评重写→仍不过→登记waivers+入修订期清单+断点标记,流水线不停摆(磨刀十五批: HALT永久挂起=无人值守死锁);每日人审队列清空一次(半自动模式B)"
        peak_rule: "章级:峰章 → alt-takes 多方案必走(2-3版盲评选优)"
        post_gates:   # 审计-32教训: 正文改动必须三联动,否则卡/台账静默失真
          - "python3 tools/card_check.py <章号> --volume <卷>  # 正文数字改动→卡数字表同步"
          - "正文涉及钱/时间/状态改动→同步 ledgers/时间线.md 与 人物状态.md"
          - "G6时序WARN必须逐条处置(核对时间线),禁止静默放过"

  phase_5_finalize:
    name: "归档"
    steps:
      - id: done
        name: "验收"
        type: script
        script: "python3 tools/pipeline.py done {N}"
        gate:
          - "done返回✅"
      - id: legacy_recheck
        name: "存量清单联动(修订期)"
        type: script
        script: "python3 tools/legacy_audit.py --write"
        gate:
          - "本章已从 ledgers/修订期清单.md 出单(若曾入单)"
      - id: ledger
        name: "台账盖章"
        type: manual
        skill: ledger-update
        gate:
          - "八账全部包含本章条目"
      - id: memory
        name: "记忆更新"
        type: manual
        skill: story-bible
        gate:
          - "章摘要已更新"
          - "当前时刻卡已更新(下一章指向+上一章末拍)"
      - id: commit
        name: "提交"
        type: script
        script: "git add -A && git commit && git push"
        gate:
          - "pre-commit hook通过"
          - "evals无回归"
      - id: volume_end
        name: "卷末义务(仅当本章=卷末章,1993审计新增)"
        type: manual
        gate:
          - "arc-review卷级连读审查落盘(story/audit/卷级连读-卷N.md.md)——done卷末门+hook会拦"
          - "人物圣经卷末快照更新(本卷关系位移/欲望缺口落点/钱刻度末值)"
          - "漂移审计本期已做(若满10章)"
          - "premise-fit复检: 本卷欲望引擎是否兑现立项承诺(无金手指书查时代红利引擎与缺口阶梯)"
          - "卷级findings回写: skills/docs若需升级→走skill-sync"
